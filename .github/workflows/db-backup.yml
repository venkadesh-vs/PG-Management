# Daily logical backup of the production database to a private Backblaze B2 bucket.
# Runs at 02:00 IST. Keeps 30 days of dailies plus every 1st-of-month copy.
# Secrets (GitHub → Settings → Secrets and variables → Actions):
#   BACKUP_DATABASE_URL  direct (unpooled) Postgres URL
#   B2_KEY_ID / B2_APP_KEY  Backblaze application key with access to the backups bucket
# Restore steps: docs/DATABASE_RECOVERY.md
name: Database backup

on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APP_KEY }}
      AWS_DEFAULT_REGION: us-east-005
      # Backblaze's S3 API does not accept the newer default checksum headers.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      ENDPOINT: https://s3.us-east-005.backblazeb2.com
      BUCKET: stayflow-backups-vs2026
    steps:
      - name: Install PostgreSQL 18 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18

      - name: Dump, verify and upload
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          file="stayflow-$(date -u +%Y-%m-%d-%H%M).dump"
          /usr/lib/postgresql/18/bin/pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges --file "$file"
          tables=$(/usr/lib/postgresql/18/bin/pg_restore --list "$file" | grep -c "TABLE DATA" || true)
          echo "Dump readable: $tables tables, $(du -h "$file" | cut -f1)"
          if [ "$tables" -lt 10 ]; then echo "Backup looks incomplete" >&2; exit 1; fi
          aws s3 cp "$file" "s3://$BUCKET/db/$file" --endpoint-url "$ENDPOINT" --only-show-errors
          echo "Uploaded db/$file"

      - name: Remove dailies older than 30 days (keeps 1st-of-month copies)
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '30 days ago' +%Y-%m-%d)
          aws s3 ls "s3://$BUCKET/db/" --endpoint-url "$ENDPOINT" | awk '{print $4}' | while read -r f; do
            [ -z "$f" ] && continue
            day=$(echo "$f" | sed -E 's/^stayflow-([0-9]{4}-[0-9]{2}-[0-9]{2}).*/\1/')
            if [[ "$day" < "$cutoff" && "${day:8:2}" != "01" ]]; then
              aws s3 rm "s3://$BUCKET/db/$f" --endpoint-url "$ENDPOINT" --only-show-errors && echo "Removed $f"
            fi
          done
