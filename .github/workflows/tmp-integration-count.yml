name: tmp integration count
on: workflow_dispatch
permissions: { contents: read }
jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -tAc 'select count(*) from "IntegrationCredential"' | sed 's/^/saved integration credentials: /'
          psql "$DATABASE_URL" -tAc 'select o.name || '' -> '' || c.provider from "IntegrationCredential" c join "Organization" o on o.id=c."organizationId"' | sed 's/^/  /'
