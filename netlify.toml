# ---------------------------------------------------------------------------
# StayFlow on Netlify.
#
# This app uses Server Components, route handlers and a live PostgreSQL
# connection, so it needs the Next.js runtime — a static export will not work.
# The official plugin provides that.
#
# Set DATABASE_URL, AUTH_SECRET, CRON_SECRET and NEXT_PUBLIC_SITE_URL in the
# Netlify UI. Never commit .env.
# ---------------------------------------------------------------------------

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Only the production deploy migrates the production database. Deploy
# previews and branch deploys must point DATABASE_URL at a separate database.
[context.production]
  command = "npm run db:deploy && npm run build"

# The daily automation (rent, reminders, billing) runs as a scheduled
# function: netlify/functions/daily-automation.mts (06:00 IST).
[functions]
  directory = "netlify/functions"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers are set by next.config.ts so every host gets the same set.

# Signed-in surfaces must never be cached by a CDN.
[[headers]]
  for = "/app/*"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/tenant/*"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/worker/*"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "private, no-store"
